<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace"><title>about</title><style>.r{opacity:0;animation:in .01s forwards}@keyframes in{to{opacity:1}}.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style><rect x=".5" y=".5" width="899" height="403" rx="10" fill="#131517" stroke="#383c40"/><path d="M.5 10.5 a10 10 0 0 1 10 -10 h879 a10 10 0 0 1 10 10 v18 h-899 z" fill="#1a1c1e"/><circle cx="20" cy="15" r="4.5" fill="#6b6f72"/><circle cx="36" cy="15" r="4.5" fill="#6b6f72"/><circle cx="52" cy="15" r="4.5" fill="#ff7a3d"/><text text-anchor="middle" x="450.0" y="19" fill="#9ba1a7" font-size="11" font-weight="400" xml:space="preserve">about.md</text><g class="r" style="animation-delay:0.20s"><text x="24" y="58" fill="#ff7a3d" font-size="14" font-weight="700" xml:space="preserve">❯</text><text x="44" y="58" fill="#d9dcdf" font-size="14" font-weight="400" xml:space="preserve">cat about.md</text></g><g class="r" style="animation-delay:0.70s"><text x="24" y="84" fill="#d9dcdf" font-size="13.5" font-weight="400" xml:space="preserve">Привет, я Макс. Data Scientist в MagnitTech, раньше был в Wildberries.</text><text x="24" y="104" fill="#d9dcdf" font-size="13.5" font-weight="400" xml:space="preserve">В DS пришёл с нуля в 19 лет, без профильного образования, прошёл 60+ техничек.</text><text x="24" y="124" fill="#d9dcdf" font-size="13.5" font-weight="400" xml:space="preserve">Сейчас пишу про вайбкодинг и AI-инструменты: как с Claude Code собирать</text><text x="24" y="144" fill="#d9dcdf" font-size="13.5" font-weight="400" xml:space="preserve">приложения, сайты и даже монтировать видео. Остальное — инженерка и DS/ML простым языком.</text></g><g class="r" style="animation-delay:1.40s"><text x="24" y="192" fill="#ff7a3d" font-size="14" font-weight="700" xml:space="preserve">❯</text><text x="44" y="192" fill="#d9dcdf" font-size="14" font-weight="400" xml:space="preserve">git log --graph --oneline</text></g><g class="r" style="animation-delay:1.80s"><text x="24" y="220" fill="#ff7a3d" font-size="13.5" font-weight="700" xml:space="preserve">*</text><text x="48.3" y="220" fill="#ff7a3d" font-size="13.5" font-weight="600" xml:space="preserve">(HEAD -&gt; main)</text><text x="169.8" y="220" fill="#d9dcdf" font-size="13.5" font-weight="400" xml:space="preserve">MagnitTech · Data Scientist</text></g><g class="r" style="animation-delay:2.05s"><text x="24" y="240" fill="#aeb6be" font-size="13.5" font-weight="700" xml:space="preserve">*</text><text x="48.3" y="240" fill="#9ba1a7" font-size="13.5" font-weight="400" xml:space="preserve">Wildberries · Data Scientist</text></g><g class="r" style="animation-delay:2.30s"><text x="24" y="260" fill="#aeb6be" font-size="13.5" font-weight="700" xml:space="preserve">*</text><text x="48.3" y="260" fill="#9ba1a7" font-size="13.5" font-weight="400" xml:space="preserve">60+ техничек, несколько офферов</text></g><g class="r" style="animation-delay:2.55s"><text x="24" y="280" fill="#aeb6be" font-size="13.5" font-weight="700" xml:space="preserve">*</text><text x="48.3" y="280" fill="#9ba1a7" font-size="13.5" font-weight="400" xml:space="preserve">вкат в DS с нуля после разговора с одноклассником</text></g><g class="r" style="animation-delay:2.90s"><text x="24" y="300" fill="#6b6f72" font-size="13.5" font-weight="400" xml:space="preserve">| </text><text x="40.2" y="300" fill="#6b6f72" font-size="13.5" font-weight="700" xml:space="preserve">*</text><text x="56.4" y="300" fill="#6b6f72" font-size="13.5" font-weight="400" xml:space="preserve">заказные студенческие работы · инвестиции · маркетинг</text><text x="24" y="320" fill="#6b6f72" font-size="13.5" font-weight="400" xml:space="preserve">|/</text><text x="24" y="340" fill="#aeb6be" font-size="13.5" font-weight="700" xml:space="preserve">*</text><text x="48.3" y="340" fill="#9ba1a7" font-size="13.5" font-weight="400" xml:space="preserve">3 курс не айтишного вуза, ни одной строчки на Python</text></g><g class="r" style="animation-delay:3.30s"><text x="24" y="382" fill="#ff7a3d" font-size="14" font-weight="700" xml:space="preserve">❯</text><rect class="cur" x="44" y="369" width="9" height="16" fill="#ff7a3d"/></g></svg>