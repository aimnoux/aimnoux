<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace"><title>about</title><style>.r{opacity:0;animation:in .01s forwards}@keyframes in{to{opacity:1}}.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style><rect x=".5" y=".5" width="899" height="269" rx="10" fill="#131517" stroke="#383c40"/><path d="M.5 10.5 a10 10 0 0 1 10 -10 h879 a10 10 0 0 1 10 10 v18 h-899 z" fill="#1a1c1e"/><circle cx="20" cy="15" r="4.5" fill="#6b6f72"/><circle cx="36" cy="15" r="4.5" fill="#6b6f72"/><circle cx="52" cy="15" r="4.5" fill="#ff7a3d"/><text text-anchor="middle" x="450.0" y="19" fill="#9ba1a7" font-size="11" font-weight="400" xml:space="preserve">about.md</text><g class="r" style="animation-delay:0.20s"><text x="24" y="58" fill="#ff7a3d" font-size="14" font-weight="700" xml:space="preserve">❯</text><text x="44" y="58" fill="#d9dcdf" font-size="14" font-weight="400" xml:space="preserve">cat about.md</text></g><g class="r" style="animation-delay:0.70s"><text x="24" y="84" fill="#d9dcdf" font-size="13.5" font-weight="400" xml:space="preserve">Привет, я Макс. Data Scientist в MagnitTech, раньше был в Wildberries.</text><text x="24" y="104" fill="#d9dcdf" font-size="13.5" font-weight="400" xml:space="preserve">Сейчас пишу про вайбкодинг и AI-инструменты: как с Claude Code собирать</text><text x="24" y="124" fill="#d9dcdf" font-size="13.5" font-weight="400" xml:space="preserve">приложения, сайты и даже монтировать видео. Остальное — инженерка и DS/ML простым языком.</text></g><g class="r" style="animation-delay:1.40s"><text x="24" y="172" fill="#ff7a3d" font-size="14" font-weight="700" xml:space="preserve">❯</text><text x="44" y="172" fill="#d9dcdf" font-size="14" font-weight="400" xml:space="preserve">git log --graph --oneline</text></g><g class="r" style="animation-delay:1.80s"><text x="24" y="200" fill="#ff7a3d" font-size="13.5"